# =============================================================================
# Help24 — backend ecosystem
# =============================================================================
# Flutter is NOT here, by design. The mobile app keeps running natively against
# http://localhost:3000 (emulator: http://10.0.2.2:3000) exactly as it does now.
# This file owns everything BEHIND that URL.
#
#   docker compose up -d --build          API only (against cloud Supabase)
#   docker compose --profile db up -d     + PostgreSQL
#   docker compose --profile cache up -d  + Redis
#   docker compose --profile tools up -d  + pgAdmin
#   docker compose --profile full up -d   everything
#
# Every value below has an inline default, so the commands above work with no
# setup beyond `backend/.env`. To override, edit docker.env and add
# `--env-file docker.env`. See DOCKER.md § Environment.
# =============================================================================

name: help24

# ── Reusable fragments ───────────────────────────────────────────────────────
# YAML anchors, not Docker features: they keep policy defined once so a service
# added in six months cannot quietly ship without log rotation or hardening.

x-logging: &logging
  driver: json-file
  options:
    # Without a cap, json-file logs grow until the disk is full. Three background
    # sweeps tick every 60s, so this backend is a steady log producer.
    # 10 MB x 3 files = 30 MB ceiling per service.
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    # Blocks setuid/setgid escalation inside the container: even a compromised
    # process cannot gain privileges it was not started with.
    - no-new-privileges:true

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # api — NestJS. The only service that exists today in production.
  # ═══════════════════════════════════════════════════════════════════════════
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: help24/backend:${HELP24_TAG:-local}
    container_name: help24-api
    <<: *hardening
    restart: unless-stopped

    # THE secrets contract: the container reads the SAME file the native
    # workflow already reads. One source of truth, so `npm run start:dev` and
    # `docker compose up` can never drift apart, and nothing is copied into an
    # image layer. If this file is missing, compose fails loudly here — copy
    # backend/.env.example to backend/.env first.
    env_file:
      - ./backend/.env

    environment:
      # NODE_ENV is overridable because the app branches on it: setting it to
      # `development` is what unlocks MPESA_DEV_FORCE_SUCCESS (mpesa.service.ts
      # hard-throws at boot if that flag is true while NODE_ENV=production).
      NODE_ENV: ${NODE_ENV:-production}

      # Fixed INSIDE the container. The host-side port is mapped below, so
      # changing which port you dial never means rebuilding the image.
      PORT: 3000

      # ── Forward-declared. The backend does not read these yet. ─────────────
      # They resolve to real, reachable services the moment the db/cache
      # profiles are up, so adopting Redis or a direct pg driver later is a
      # code change with zero infrastructure change.
      REDIS_URL: redis://:${REDIS_PASSWORD:-help24_local_redis}@redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-help24}:${POSTGRES_PASSWORD:-help24_local_dev}@postgres:5432/${POSTGRES_DB:-help24}

    ports:
      # API_BIND defaults to 0.0.0.0 to preserve today's workflow — a physical
      # Android device on the same Wi-Fi must be able to reach the API by LAN
      # IP, which a loopback bind would silently break. On untrusted networks
      # set API_BIND=127.0.0.1 in docker.env.
      - "${API_BIND:-0.0.0.0}:${API_PORT:-3000}:3000"

    networks:
      - edge   # published to the host + outbound to Supabase / Daraja / FCM
      - data   # reaches postgres (unused today, wired for workers)
      - cache  # reaches redis    (unused today, wired for queues/caching)

    depends_on:
      # `required: false` is the key to keeping profiles modular: wait for these
      # to be HEALTHY if they are part of the run, and start perfectly happily
      # if they are not. Without it, `docker compose up` with no profile would
      # fail on a missing dependency.
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

    # The image defines HEALTHCHECK (GET /health). Restated here so `docker
    # compose ps` semantics are visible without reading the Dockerfile, and so
    # future services can gate on `api: service_healthy`.
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get({host:'127.0.0.1',port:process.env.PORT||3000,path:'/health'},s=>process.exit(s.statusCode===200?0:1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # main.ts calls enableShutdownHooks(), so SIGTERM drains in-flight requests
    # and clears the three sweep intervals. 30s is generous headroom; the
    # default 10s could cut a slow Daraja callback in half.
    stop_grace_period: 30s

    # ── Runtime hardening (Phase 13) ──────────────────────────────────────────
    # The filesystem is immutable at runtime. Nothing in this service writes to
    # disk — config is env, state is Supabase, logs are stdout. An attacker who
    # achieves RCE cannot drop a payload anywhere except the tmpfs below.
    # If a future dependency needs scratch space and crashes with EROFS, the fix
    # is another tmpfs entry — not deleting this line.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL   # binding :3000 as an unprivileged user needs no capabilities

    logging: *logging

  # ═══════════════════════════════════════════════════════════════════════════
  # postgres — local PostgreSQL   [profile: db]
  # ═══════════════════════════════════════════════════════════════════════════
  # READ THIS BEFORE ASSUMING IT REPLACES SUPABASE.
  #
  # The backend talks to Supabase through @supabase/supabase-js — that is
  # PostgREST over HTTPS, not the Postgres wire protocol. There is no `pg`
  # driver and no DATABASE_URL in the source. So pointing the API at this
  # container is not a matter of changing a connection string: it cannot speak
  # to it at all. On top of that, 45 of the 83 files in supabase/migrations
  # reference auth.*, storage.*, service_role or authenticated — objects that
  # only exist in a Supabase stack.
  #
  # What this service IS for:
  #   - a real Postgres for psql / DBeaver / analytics scratch work
  #   - the datastore for future workers and queues that WILL use a pg driver
  #   - somewhere to rehearse SQL before promoting it to a Supabase migration
  #
  # For a genuinely local Help24 backend, use the Supabase CLI stack instead —
  # it provides PostgREST + auth + storage and is a one-line env switch.
  # DOCKER.md § Switching between Supabase and local Postgres has the recipe.
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: help24-postgres
    # `tools` is listed here because pgAdmin depends on this service, and a
    # depends_on does NOT activate a dependency's profile — without `tools` in
    # this list, `--profile tools` fails as an invalid project.
    profiles: [db, tools, full]
    <<: *hardening
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-help24}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-help24_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-help24}
      # Data lives in a SUBDIRECTORY of the mount point. The postgres image
      # refuses to initialise into a non-empty directory, and volume mount roots
      # can pick up lost+found or platform metadata — this sidesteps that class
      # of "database directory is not empty" failure entirely.
      PGDATA: /var/lib/postgresql/data/pgdata
      # Deterministic collation. Left to the host locale, index ordering can
      # differ between machines and break assumptions carried over from Supabase.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    volumes:
      - pgdata:/var/lib/postgresql/data
      # Opt-in seed/bootstrap SQL. Runs ONCE, on first initialisation of an
      # empty volume — never again. Empty by default: see the directory README
      # for why Supabase migrations must not be dropped in here unmodified.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    ports:
      # Loopback only. A database listening on 0.0.0.0 is reachable by every
      # device on the coffee-shop Wi-Fi; there is no reason for anything but
      # this laptop to dial it.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    networks:
      - data   # deliberately NOT on `edge` and NOT on `cache`

    healthcheck:
      # -h 127.0.0.1 forces a real TCP connection. Plain `pg_isready` checks the
      # unix socket, which comes up during initdb — that reports healthy while
      # the server is still bootstrapping and not yet accepting TCP clients.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      # First boot runs initdb + any seed scripts; failures here are not counted.
      start_period: 30s
      retries: 5

    # Postgres flushes on shutdown; killing it early risks recovery on next boot.
    stop_grace_period: 30s
    logging: *logging

  # ═══════════════════════════════════════════════════════════════════════════
  # redis — prepared, NOT yet used   [profile: cache]
  # ═══════════════════════════════════════════════════════════════════════════
  # No application code reads REDIS_URL today. This service exists so that
  # caching, rate limiting, queues, sessions and the recommendation cache are a
  # dependency install away rather than an infrastructure project.
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: help24-redis
    profiles: [cache, full]
    <<: *hardening
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-help24_local_redis}
      # AOF: durable to the last second. Chosen over RDB-only because the first
      # real workload here will be a job queue, where losing the last few
      # minutes of writes means losing jobs.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      # noeviction, NOT allkeys-lru. An LRU policy silently deletes queue state
      # under memory pressure; BullMQ and every other Redis queue require
      # noeviction. When Redis is used purely as a cache later, a SEPARATE
      # instance (or db index) should carry the lru policy — do not relax this one.
      - --maxmemory-policy
      - noeviction

    environment:
      # Consumed by the healthcheck below, not by redis-server itself.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-help24_local_redis}

    volumes:
      - redisdata:/data

    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"

    networks:
      - cache  # cannot reach postgres; postgres cannot reach it

    healthcheck:
      # --no-auth-warning keeps the credential warning off stderr every 10s,
      # which would otherwise be the noisiest line in `docker compose logs`.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

    stop_grace_period: 15s   # allow a final AOF fsync
    logging: *logging

  # ═══════════════════════════════════════════════════════════════════════════
  # pgadmin — local-only database UI   [profile: tools]
  # ═══════════════════════════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-8.14}
    container_name: help24-pgadmin
    profiles: [tools, full]
    <<: *hardening
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-dev@help24.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-help24_local_dev}
      # Desktop mode: single local user, no login screen, no master password
      # prompt. Correct precisely BECAUSE this is bound to loopback and never
      # exposed. Never run this configuration on a routable address.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: 80
      # Trim the default request log to warnings — pgAdmin is chatty by default.
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 30

    volumes:
      # Preloads the "Help24 Local" server entry, so there is nothing to
      # configure by hand after `up`.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Persists saved queries, layout and preferences across restarts.
      - pgadmin:/var/lib/pgadmin

    ports:
      - "${PGADMIN_BIND:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"

    networks:
      - edge   # reachable from the host browser
      - data   # reaches postgres by service name

    depends_on:
      postgres:
        condition: service_healthy
        # Unlike api, pgAdmin genuinely has no purpose without postgres, so
        # `--profile tools` alone should pull postgres in rather than start a
        # UI pointed at nothing.
        required: true

    logging: *logging


# ═════════════════════════════════════════════════════════════════════════════
# Networks (Phase 7) — least privilege by construction
# ═════════════════════════════════════════════════════════════════════════════
# Three segments instead of one default bridge. The property this buys: postgres
# and redis share NO network, and neither shares one with the outside world. A
# compromised Redis cannot port-scan the database.
#
# `api` is the only service that spans all three — the intended blast radius.
#
# When NGINX arrives (Phase 15) it takes over `edge` and api drops its published
# port, becoming reachable only through the proxy. Workers will join `data` +
# `cache` and no `edge` at all: no inbound path, by construction.
networks:
  edge:
    name: help24_edge
    driver: bridge
  data:
    name: help24_data
    driver: bridge
    # Hardening upgrade once you no longer need host access to 5432:
    # `internal: true` removes this segment's route to the internet entirely,
    # so a compromised database cannot exfiltrate outward. It also blocks
    # published ports on some Docker versions — flip it, then verify psql from
    # the host still works before keeping it.
    # internal: true
  cache:
    name: help24_cache
    driver: bridge


# ═════════════════════════════════════════════════════════════════════════════
# Volumes (Phase 9) — the only state that outlives a container
# ═════════════════════════════════════════════════════════════════════════════
# Named volumes, not bind mounts: Docker owns the permissions (no uid mismatch
# on Windows) and `docker compose down` cannot delete them by accident — that
# needs an explicit `down -v`.
#
# Nothing here holds build artefacts or secrets. Artefacts are rebuilt from
# source; secrets are injected at runtime and never persisted.
volumes:
  pgdata:
    name: help24_pgdata
  redisdata:
    name: help24_redisdata
  pgadmin:
    name: help24_pgadmin
