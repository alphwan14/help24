# files.help24.co.ke — private chat attachments. See DEPLOY.md before deploying.
name = "help24-files"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Served ONLY on the Help24 hostname. No *.workers.dev address and no preview
# URLs: a second hostname would be a second place the endpoint is reachable.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "files.help24.co.ke", custom_domain = true },
]

# Invocation logs would record request URLs, and a one-time link's token rides
# in its URL for the single request that burns it. Leave off; the Worker's own
# console lines never contain tokens, uids or full ids.
[observability]
enabled = false

[vars]
SUPABASE_URL = "https://taohzhnvaitrpxcyjflq.supabase.co"
FIREBASE_PROJECT_ID = "help24-24410"

# Burnt one-time link nonces: one strongly consistent object per link, wiped
# minutes after it expires (src/nonce-store.js). SQLite-backed, which is what
# the Workers Free plan supports.
[[durable_objects.bindings]]
name = "LINK_NONCES"
class_name = "LinkNonce"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LinkNonce"]

# Per-user rate limits (keyed by Firebase uid). Uploads: 20 a minute — a person
# sending a set of photos stays far below it. Browser links: 20 a minute.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "24001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LINK_LIMITER"
namespace_id = "24002"
simple = { limit = 20, period = 60 }

# Secrets — set with `wrangler secret put <NAME>`, never written here:
#   SUPABASE_SERVICE_ROLE_KEY
#   LINK_SIGNING_SECRET
