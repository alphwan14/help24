name: help24
description: A modern multi-service marketplace mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  flutter_animate: ^4.3.0
  iconsax: ^0.0.8
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  cached_network_image: ^3.3.1
  supabase_flutter: ^2.3.0
  uuid: ^4.2.0
  shared_preferences: ^2.2.2
  # Firebase Auth & Firestore (messaging: real-time, offline)
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.2
  firebase_messaging: ^15.1.6
  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.4.0
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  connectivity_plus: ^6.0.5
  http: ^1.2.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.4
  # Pinned to 9.x deliberately. 10.1.0+ requires win32 ^6, while file_picker 8
  # caps it at ^5 — and no STABLE file_picker allows win32 6 yet (first is
  # 12.0.0-beta.1). win32 only affects the Windows desktop target, which this
  # app does not ship, so the conflict is real to the resolver and irrelevant to
  # the product. The only call site is PackageInfo.fromPlatform() for the
  # version label, whose API is identical in both majors.
  package_info_plus: ^9.0.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

# THE FOREGROUND IS NOT THE TILE.
# `image_path` is the full square tile, which is right for the legacy launcher
# icon and for iOS/macOS/Windows, where the platform draws the artwork as given.
# The adaptive icon is different: Android composites the foreground inside a
# mask of its own, so handing it the tile would put a square inside that mask
# and letterbox the mark. `adaptive_icon_foreground` is therefore a TRANSPARENT
# render of the bare mark at 47% of the 108dp canvas. It lives in branding/
# rather than assets/ so it is not also shipped inside the APK.
#
# WHY 47% AND NOT MORE. The guaranteed-visible region is a CIRCLE 66dp across,
# and a launcher may mask to any shape inscribed in it. This mark is wide and
# tall, so the quantity that has to fit inside that circle is its diagonal, not
# its width. At 61% by width the artwork's furthest point sat 42.7dp from centre
# against a 33dp safe radius and One UI's squircle sheared the caps off both
# uprights. Verified on an SM-G986U. Re-derive this number if the artwork's
# aspect ratio ever changes.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/help24_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#12161A"
  adaptive_icon_foreground: "branding/adaptive_foreground.png"
  # MUST be 0. The package insets the foreground by 16% on each side by default,
  # which is right when the foreground is a full-bleed image and wrong here: the
  # padding is already drawn into adaptive_foreground.png, where the mark spans
  # 61% of the canvas. Leaving the default applies it twice — 61% × 0.68 = 41.5%
  # — and the mark lands undersized inside the launcher's mask.
  adaptive_icon_foreground_inset: 0
  web:
    generate: false
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/l10n/
    # The vector brand marks the app renders at runtime. A bare `assets/` entry
    # does NOT recurse, so this subdirectory needs its own line or every
    # SvgPicture.asset against it throws at runtime rather than at build time.
    - assets/brand/
    # Reference datasets (locations, professions). Bundled so every picker is
    # complete, searchable and offline-capable on a fresh install, before any
    # migration is applied. See lib/services/reference_registry.dart.
    - assets/data/
