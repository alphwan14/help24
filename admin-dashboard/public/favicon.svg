<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Help24">
  <title>Help24</title>
  <!-- Follows the browser's theme: the paper tile with ink bars in light mode,
       matching the 1.0.12 app icon, and the ink tile with paper bars in dark
       mode. The widened gaps either side of the crossbar keep it readable at
       16px; see app/layout.tsx. -->
  <style>
    .tile { fill: #F5F3EF; stroke: #E2DED6; stroke-width: 1.5; }
    .bar { fill: #12161A; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #12161A; stroke: none; }
      .bar { fill: #F5F3EF; }
    }
  </style>
  <rect class="tile" x="0.75" y="0.75" width="62.5" height="62.5" rx="10.24"/>
  <rect class="bar" x="12.8" y="15.36" width="8.96" height="33.28" rx="4.48"/>
  <rect class="bar" x="42.24" y="15.36" width="8.96" height="33.28" rx="4.48"/>
  <rect x="28.16" y="28.16" width="7.68" height="7.68" rx="3.84" fill="#E8A33D"/>
</svg>
